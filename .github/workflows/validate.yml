name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills, agents, README, links and manifests
        run: node scripts/validate.mjs
      - name: Syntax-check workflow scripts
        run: |
          shopt -s nullglob
          for f in workflows/*.js templates/*.js; do
            node --check --input-type=module < "$f" || { echo "syntax error in $f"; exit 1; }
          done
