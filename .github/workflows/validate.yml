name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills, agents, README, links and manifests
        run: node scripts/validate.mjs
      - name: Syntax-check workflow scripts
        run: node scripts/check-workflows.mjs
